name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Test the tests against the reference solutions
        run: ./mvnw -B verify -Psolutions
      - name: Check that the unsolved stubs build and are reported as skipped
        run: ./mvnw -B verify
